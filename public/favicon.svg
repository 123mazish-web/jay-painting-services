    <line x1="145" y1="75" x2="145" y2="117" stroke="#D9232A" stroke-width="5" />
    <line x1="108" y1="96" x2="182" y2="96" stroke="#D9232A" stroke-width="5" />

    {/* Angled White Roof Accent Line */}
